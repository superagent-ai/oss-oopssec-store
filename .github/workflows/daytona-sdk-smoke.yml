name: PR triage Daytona SDK smoke test

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-triage:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare PR triage context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Pull request title: ${{ github.event.pull_request.title }}"
