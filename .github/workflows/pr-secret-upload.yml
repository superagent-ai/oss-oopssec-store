name: PR Secret Upload

on:
  pull_request_target:
    types: [opened, synchronize]

permissions: write-all

jobs:
  upload-checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out untrusted PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Upload checkout artifact
        uses: actions/upload-artifact@v5
        with:
          name: pr-checkout-${{ github.event.pull_request.number }}
          path: .
          retention-days: 7

      - name: Print token shape for testing
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | wc -c
