name: PR triage notes

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  triage-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Log contributor notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "Contributor notes: ${{ github.event.pull_request.body }}"
