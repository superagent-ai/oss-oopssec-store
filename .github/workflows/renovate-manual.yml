name: Manual Renovate validation test

on:
  workflow_dispatch:
    inputs:
      bot_login:
        description: GitHub username that owns RENOVATE_TOKEN
        required: true
        type: string
      dry_run:
        description: Preview the update without creating a branch or pull request
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: renovate-manual-validation
  cancel-in-progress: false

jobs:
  renovate:
    name: Test custom dependency bot
    if: github.repository == 'superagent-ai/oss-oopssec-store' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify custom bot account
        id: account
        env:
          GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          EXPECTED_BOT_LOGIN: ${{ inputs.bot_login }}
          SIGNING_KEY: ${{ secrets.RENOVATE_GIT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" || -z "$SIGNING_KEY" ]]; then
            echo "::error::Configure RENOVATE_TOKEN and RENOVATE_GIT_PRIVATE_KEY in repository Actions secrets."
            exit 1
          fi

          account="$(gh api /user)"
          login="$(jq -er '.login' <<< "$account")"
          account_type="$(jq -er '.type' <<< "$account")"
          if [[ "$account_type" != "User" || "${login,,}" != "${EXPECTED_BOT_LOGIN,,}" ]]; then
            echo "::error::RENOVATE_TOKEN must belong to the regular GitHub account entered in bot_login."
            exit 1
          fi

          git_author="$(jq -er '"\(.login) <\(.id)+\(.login)@users.noreply.github.com>"' <<< "$account")"
          printf 'git-author=%s\n' "$git_author" >> "$GITHUB_OUTPUT"
          printf '### Custom bot account\n\nGitHub login: `%s`\n\nGit author: `%s`\n' "$login" "$git_author" >> "$GITHUB_STEP_SUMMARY"

      - name: Run self-hosted Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          configurationFile: .github/renovate-manual.cjs
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-version: 44.235.1
          additional-env-list: VALIDATION_DRY_RUN
        env:
          RENOVATE_GIT_AUTHOR: ${{ steps.account.outputs.git-author }}
          RENOVATE_GIT_PRIVATE_KEY: ${{ secrets.RENOVATE_GIT_PRIVATE_KEY }}
          RENOVATE_GIT_PRIVATE_KEY_PASSPHRASE: ${{ secrets.RENOVATE_GIT_PRIVATE_KEY_PASSPHRASE }}
          VALIDATION_DRY_RUN: ${{ inputs.dry_run }}
          LOG_LEVEL: info
